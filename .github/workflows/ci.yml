name: CI
on:
    pull_request:
        branches:
            - main
jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
              with:
                  fetch-depth: 2
            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true
            # https://viteplus.dev/guide/github-actions-cache
            - name: Restore Vite Task cache
              id: vite-task-cache
              uses: actions/cache/restore@v6
              with:
                  path: node_modules/.vite/task-cache
                  key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      vite-task-${{ runner.os }}-${{ runner.arch }}-
            - name: Check, build, and test
              run: bash .github/scripts/run-ci.sh
            - name: Save Vite Task cache
              if: success()
              uses: actions/cache/save@v6
              with:
                  path: node_modules/.vite/task-cache
                  key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
