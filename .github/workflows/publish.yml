name: Publish
on:
    push:
        branches:
            - main
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            # id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v3
              with:
                  fetch-depth: 2
            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  cache: true
            # https://viteplus.dev/guide/github-actions-cache
            - name: Restore Vite Task cache
              id: vite-task-cache
              uses: actions/cache/restore@v6
              with:
                  path: node_modules/.vite/task-cache
                  key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      vite-task-${{ runner.os }}-${{ runner.arch }}-
            - name: Check, build, and test
              run: bash .github/scripts/run-ci.sh
            - name: Save Vite Task cache
              if: success()
              uses: actions/cache/save@v6
              with:
                  path: node_modules/.vite/task-cache
                  key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
            - name: Create publish PR
              id: changesets
              uses: changesets/action@v1
              with:
                  publish: pnpm changeset publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
